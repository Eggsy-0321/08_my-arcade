<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080e20">
  <meta name="description" content="タップで十字に反転。25マスすべてを点灯させるネオンパズル。">
  <title>LIGHTS OUT — MY ARCADE</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./model.js" defer></script>
  <script src="./game.js" defer></script>
</head>
<body>
<main class="cabinet">
  <header><a href="../../index.html">← MY ARCADE</a><span>PUZZLE / 06</span></header>
  <div class="marquee"><h1>✦ LIGHTS OUT ✦</h1><span>NORMAL</span></div>
  <div class="hud"><span>MOVES<strong id="moves">0</strong></span><span>TIME<strong id="time">00:00.00</strong></span></div>
  <div class="arena">
    <div id="board" aria-label="5×5のライト盤面"></div>
    <section class="overlay" id="overlay" aria-labelledby="screen-title">
      <p class="eyebrow">NEON PUZZLE / NORMAL</p>
      <h2 id="screen-title">LIGHTS OUT</h2>
      <p id="message">タップで十字に反転<br>すべて点灯でクリア！</p>
      <div id="results" hidden>
        <p>MOVES <strong id="final-moves"></strong> / BEST <strong id="best-moves"></strong><small id="moves-record"></small></p>
        <p>TIME <strong id="final-time"></strong><br>BEST <strong id="best-time"></strong><small id="time-record"></small></p>
      </div>
      <button id="start">START ▶</button>
      <button id="resume" hidden>RESUME ▶</button>
      <div id="result-actions" hidden><button id="retry">RETRY ↻</button><a class="button" id="home" href="../../index.html">HOME — MY ARCADEへ戻る</a></div>
    </section>
  </div>
  <div class="controls"><button id="reset" disabled>RESET</button><button id="pause" disabled>PAUSE</button></div>
  <footer><span>TAP / CLICK · ALL LIGHTS ON</span><button id="sound" aria-pressed="true">SOUND ON</button></footer>
  <p class="sr-only" id="status" aria-live="polite"></p>
  <noscript>プレイするにはJavaScriptを有効にしてください。</noscript>
</main>
</body>
</html>
