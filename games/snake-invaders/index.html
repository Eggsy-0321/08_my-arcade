<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080e20">
  <meta name="description" content="迫る蛇を撃ち落とせ。左右移動と自動射撃で挑むエンドレス・レトロシューティング。">
  <title>SNAKE INVADERS — MY ARCADE</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./model.js" defer></script>
  <script src="./game.js" defer></script>
</head>
<body>
<main class="cabinet">
  <header><a href="../../index.html">← MY ARCADE</a><span>SHOOTING / 05</span></header>
  <div class="marquee">✦ SNAKE INVADERS ✦</div>
  <div class="hud"><span>SCORE <strong id="score">0</strong></span><span>BEST <strong id="best">0</strong></span><button id="pause" disabled>PAUSE</button></div>
  <div class="field-wrap"><div class="arena">
    <canvas id="game" width="360" height="640" role="img" aria-label="蛇を撃つゲーム。左右キー、または横ドラッグで宇宙船を操作。射撃は自動。"></canvas>
    <section class="overlay" id="overlay" aria-labelledby="screen-title">
      <p class="eyebrow">ENDLESS SHOOTING / 05</p>
      <h1 id="screen-title">SNAKE<br>INVADERS</h1>
      <p id="message">迫る蛇の頭を狙え！</p>
      <p class="record" id="result-score" hidden></p>
      <p class="record">BEST <strong id="result-best">0</strong></p>
      <button id="sound" aria-pressed="false">SOUND OFF</button>
      <button id="start">START ▶</button>
      <button id="resume" hidden>RESUME ▶</button>
      <div id="result-actions" hidden><button id="retry">RETRY ↻</button><a class="button" id="home" href="../../index.html">HOME — MY ARCADEへ戻る</a></div>
      <p id="hint">横ドラッグ / ← → で移動・自動射撃<br>黄色い頭が赤い線に触れたら終了<br>BODY +10 · HEAD +100 + BODY ×20</p>
    </section>
  </div></div>
  <footer>DRAG / ← → MOVE · AUTO FIRE</footer>
  <p class="sr-only" id="status" aria-live="polite"></p>
  <noscript>プレイするにはJavaScriptを有効にしてください。</noscript>
</main>
</body>
</html>
