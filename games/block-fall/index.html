<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101524">
  <title>BLOCK FALL | MY ARCADE</title>
  <link rel="stylesheet" href="style.css">
  <script src="model.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <main class="game-shell">
    <header><a href="../../index.html" class="home-top">← MY ARCADE</a><span>No.10 / v1.0</span></header>
    <div class="title-row"><h1>BLOCK <span>FALL</span></h1><div class="settings"><button id="sound" type="button" aria-pressed="true" aria-label="効果音の切り替え">SOUND ON</button><button id="pause" type="button" disabled>PAUSE</button></div></div>
    <section class="arena" aria-label="BLOCK FALL ゲーム画面">
      <div class="board-wrap"><canvas id="board" width="400" height="800" aria-label="10列20行の盤面"></canvas></div>
      <aside class="hud">
        <div><span>SCORE</span><strong id="score">0</strong></div>
        <div><span>BEST</span><strong id="best">0</strong></div>
        <div><span>LINES</span><strong id="lines">0</strong></div>
        <div><span>LEVEL</span><strong id="level">1</strong></div>
        <div class="next-box"><span>NEXT</span><canvas id="next" width="160" height="120" aria-label="次のブロック"></canvas></div>
        <p class="endless">ENDLESS<br>7 BLOCKS<br>ONE MORE LINE.</p>
      </aside>
      <div id="countdown" role="status" aria-live="polite" hidden>3</div>
      <section id="overlay" class="overlay" aria-labelledby="heading">
        <h2 id="heading">BLOCK FALL</h2>
        <p id="message">つないで、消して、その先へ。<br>横一列を埋めてハイスコアを目指そう。</p>
        <p id="results" hidden></p>
        <button id="start" type="button">START</button>
        <button id="resume" type="button" hidden>RESUME</button>
        <button id="retry" type="button" hidden>RETRY</button>
        <a id="home" href="../../index.html">HOME / MY ARCADEへ戻る</a>
      </section>
    </section>
    <nav class="controls" aria-label="ゲーム操作">
      <button type="button" data-action="left" aria-label="左へ移動"><b>◀</b>LEFT</button>
      <button type="button" data-action="right" aria-label="右へ移動"><b>▶</b>RIGHT</button>
      <button type="button" data-action="rotate" aria-label="時計回りに90度回転"><b>↻</b>ROTATE</button>
      <button type="button" data-action="soft" aria-label="長押しでソフトドロップ"><b>▼</b>SOFT</button>
      <button type="button" data-action="hard" aria-label="ハードドロップ"><b>⤓</b>HARD</button>
    </nav>
    <p class="help">← → 移動 · ↑ 回転 · ↓ ソフト · Space ハード · Esc 一時停止</p>
  </main>
</body>
</html>
