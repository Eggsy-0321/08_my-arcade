<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080e20">
  <title>FLASHLIGHT MAZE | MY ARCADE</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./model.js" defer></script><script src="./game.js" defer></script>
</head>
<body>
<main class="cabinet">
  <header><a href="../../index.html">← MY ARCADE</a><button id="sound" type="button" aria-pressed="true">SOUND ON</button></header>
  <h1>FLASHLIGHT MAZE <small>08</small></h1>
  <div class="hud"><div><span id="phase">MEMORIZE</span><output id="time">20</output></div><div><span>BEST</span><output id="best">--:--.--</output></div></div>
  <section class="arena" aria-label="迷路">
    <canvas id="canvas" width="520" height="520" aria-label="水色の丸がプレイヤー、ピンクのGがゴール"></canvas>
    <div id="overlay">
      <p class="eyebrow">MY ARCADE · 08</p><h2 id="screen-title">FLASHLIGHT<br>MAZE</h2>
      <p id="message">20秒で迷路を記憶しよう。<br>暗転したら、光を頼りにゴールへ！<br>方向ボタン：タップで1マス・長押しで連続<br>PC：矢印キー / WASD<br>記憶中は移動できません。</p>
      <div id="results" hidden><p>TIME <strong id="final-time"></strong></p><p>BEST <strong id="final-best"></strong></p></div>
      <button id="start" type="button">START</button><button id="resume" type="button" hidden>RESUME</button>
      <button id="retry" type="button" hidden>RETRY</button><a id="home" href="../../index.html" hidden>HOME — MY ARCADEへ戻る</a>
    </div>
  </section>
  <div class="actions"><button id="pause" type="button" disabled>PAUSE</button><button id="restart" type="button" disabled>RESTART</button></div>
  <section class="dpad" aria-label="移動方向">
    <button id="up" data-direction="up" type="button" aria-label="上に移動">▲</button>
    <button id="left" data-direction="left" type="button" aria-label="左に移動">◀</button>
    <span aria-hidden="true">✦</span><button id="right" data-direction="right" type="button" aria-label="右に移動">▶</button>
    <button id="down" data-direction="down" type="button" aria-label="下に移動">▼</button>
  </section>
  <div id="result-slot" hidden></div>
  <p id="status" role="status" class="sr-only"></p>
</main>
</body>
</html>
